services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: orbit
      POSTGRES_DB: orbit
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - orbit-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbit -d orbit"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - orbit-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  workers:
    profiles: ["workers"]
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: postgresql://orbit:orbit@postgres:5432/orbit?schema=public
      REDIS_URL: redis://redis:6379
      SCREENSHOT_STORAGE: /app/storage/evidence
      ORBIT_DEMO_MODE: "false"
      ORBIT_SECRET_ENCRYPTION_KEY: ${ORBIT_SECRET_ENCRYPTION_KEY:-}
      AI_SCANNER_MODEL: ${AI_SCANNER_MODEL:-gpt-5.6-luna}
      AI_CRITIC_MODEL: ${AI_CRITIC_MODEL:-}
      AI_SCANNER_REASONING_EFFORT: ${AI_SCANNER_REASONING_EFFORT:-high}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      AI_SCANNER_REQUEST_TIMEOUT_MS: ${AI_SCANNER_REQUEST_TIMEOUT_MS:-60000}
      AI_SCANNER_OPENAI_MAX_RETRIES: ${AI_SCANNER_OPENAI_MAX_RETRIES:-5}
      AI_SCANNER_OPENAI_RETRY_BASE_MS: ${AI_SCANNER_OPENAI_RETRY_BASE_MS:-5000}
      AI_SCANNER_OPENAI_RETRY_MAX_MS: ${AI_SCANNER_OPENAI_RETRY_MAX_MS:-120000}
      AI_SCANNER_OPENAI_RETRY_TOTAL_MS: ${AI_SCANNER_OPENAI_RETRY_TOTAL_MS:-900000}
      AI_SCANNER_OPENAI_MAX_RESUMES: ${AI_SCANNER_OPENAI_MAX_RESUMES:-12}
      AI_SCANNER_MAX_RUNTIME_MS: ${AI_SCANNER_MAX_RUNTIME_MS:-3600000}
      AI_SCANNER_MAX_TOOL_CALLS: ${AI_SCANNER_MAX_TOOL_CALLS:-400}
      AI_SCANNER_MAX_TOKENS: ${AI_SCANNER_MAX_TOKENS:-20000000}
      AI_SCANNER_MAX_COST_USD: ${AI_SCANNER_MAX_COST_USD:-50}
      AI_SCANNER_MAX_OUTPUT_TOKENS: ${AI_SCANNER_MAX_OUTPUT_TOKENS:-32000}
      AI_SCANNER_FINALIZATION_MAX_OUTPUT_TOKENS: ${AI_SCANNER_FINALIZATION_MAX_OUTPUT_TOKENS:-64000}
      AI_SCANNER_FINALIZATION_TOKEN_RESERVE: ${AI_SCANNER_FINALIZATION_TOKEN_RESERVE:-400000}
      AI_SCANNER_CONTEXT_COMPACT_THRESHOLD: ${AI_SCANNER_CONTEXT_COMPACT_THRESHOLD:-200000}
      AI_SCANNER_MAX_EVIDENCE_BYTES: ${AI_SCANNER_MAX_EVIDENCE_BYTES:-5000000}
      AI_SCANNER_INPUT_COST_PER_MILLION: ${AI_SCANNER_INPUT_COST_PER_MILLION:-0.2}
      AI_SCANNER_OUTPUT_COST_PER_MILLION: ${AI_SCANNER_OUTPUT_COST_PER_MILLION:-1.2}
      AI_SCANNER_BROWSER_HEADLESS: ${AI_SCANNER_BROWSER_HEADLESS:-true}
    volumes:
      - orbit-evidence:/app/storage/evidence
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  orbit-postgres:
  orbit-redis:
  orbit-evidence:
