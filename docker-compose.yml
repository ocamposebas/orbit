services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: orbit
      POSTGRES_DB: orbit
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - orbit-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbit -d orbit"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - orbit-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  workers:
    profiles: ["workers"]
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: postgresql://orbit:orbit@postgres:5432/orbit?schema=public
      REDIS_URL: redis://redis:6379
      SCREENSHOT_STORAGE: /app/storage/evidence
      ORBIT_DEMO_MODE: "false"
    volumes:
      - orbit-evidence:/app/storage/evidence
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  orbit-postgres:
  orbit-redis:
  orbit-evidence:
