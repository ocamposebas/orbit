services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: orbit
      POSTGRES_DB: orbit
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - orbit-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbit -d orbit"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - orbit-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  workers:
    profiles: ["workers"]
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: postgresql://orbit:orbit@postgres:5432/orbit?schema=public
      REDIS_URL: redis://redis:6379
      SCREENSHOT_STORAGE: /app/storage/evidence
      ORBIT_DEMO_MODE: "false"
      AI_PROVIDER: ${AI_PROVIDER:-openai-compatible}
      DUAL_REVIEW_MODE: ${DUAL_REVIEW_MODE:-enforced}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_REVIEW_MODEL: ${AI_REVIEW_MODEL:-gpt-5.6-luna}
      AI_CRITIC_MODEL: ${AI_CRITIC_MODEL:-gpt-5.6-luna}
      AI_REVIEW_REASONING_EFFORT: ${AI_REVIEW_REASONING_EFFORT:-high}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-45000}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-3000}
      AI_AUDIT_MAX_TIME_MS: ${AI_AUDIT_MAX_TIME_MS:-180000}
      AI_AUDIT_MAX_TOOL_CALLS: ${AI_AUDIT_MAX_TOOL_CALLS:-40}
      AI_AUDIT_MAX_PAGES: ${AI_AUDIT_MAX_PAGES:-250}
      AI_AUDIT_MAX_IMAGE_REGIONS: ${AI_AUDIT_MAX_IMAGE_REGIONS:-120}
      AI_AUDIT_MAX_DOCUMENTS: ${AI_AUDIT_MAX_DOCUMENTS:-24}
      AI_AUDIT_MAX_TOKENS: ${AI_AUDIT_MAX_TOKENS:-250000}
      AI_AUDIT_MAX_COST_USD: ${AI_AUDIT_MAX_COST_USD:-25}
      AI_INPUT_COST_PER_MILLION: ${AI_INPUT_COST_PER_MILLION:-0}
      AI_OUTPUT_COST_PER_MILLION: ${AI_OUTPUT_COST_PER_MILLION:-0}
    volumes:
      - orbit-evidence:/app/storage/evidence
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  orbit-postgres:
  orbit-redis:
  orbit-evidence:
